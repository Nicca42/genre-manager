[package]
name = "genera-manager"
version = "0.1.0"
description = "Offline music metadata editor"
authors = ["Genera Manager"]
edition = "2021"

[lib]
name = "genera_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
lofty = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
walkdir = "2"
